<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kết quả thao tác định kỳ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/vnpay-demo.css}">
    <style>
        .page-shell { max-width: 900px; margin: 0 auto; }
        .card-elevated { border-radius: 14px; }
        .section-title { font-weight: 600; }
        .result-table th {
            width: 30%;
            background: #f7f9fc;
            font-weight: 600;
            color: #495057;
        }
        .result-table td { word-break: break-all; }
        .badge-status {
            font-size: 0.85rem;
            padding: 0.4rem 0.75rem;
            border-radius: 999px;
            font-weight: 600;
        }
        .badge-success { background: #e6f4ea; color: #0f9d58; }
        .badge-fail { background: #fde7e9; color: #d93025; }
        details summary {
            cursor: pointer;
            font-weight: 600;
            color: var(--brand, #0052cc);
        }
        pre.raw-json {
            background: #f4f6f9;
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-break: break-all;
            margin: 0.75rem 0 0;
            max-height: 320px;
            overflow: auto;
        }
    </style>
</head>
<body class="vnpay-demo py-5">

<div class="page-shell container">
    <div class="text-center mb-4">
        <h1 class="section-title mb-1" th:text="${title}">Kết quả</h1>
        <p class="text-muted mb-0">Phản hồi thao tác định kỳ từ VNPay.</p>
    </div>

    <div class="card-elevated card p-4">
        <div class="text-center mb-3">
            <img th:src="@{/vnpay-logo.png}" alt="VNPAY" style="width: 90px;">
        </div>

        <div class="alert d-flex align-items-center gap-2"
             th:classappend="${result.success} ? 'alert-success' : 'alert-danger'">
            <span class="badge-status"
                  th:classappend="${result.success} ? 'badge-success' : 'badge-fail'"
                  th:text="${result.success} ? 'Thành công' : 'Thất bại'"></span>
            <span th:text="${result.success} ? 'Thao tác thành công.' : 'Thao tác thất bại. Xem chi tiết bên dưới.'"></span>
        </div>

        <div class="table-responsive">
            <table class="table table-bordered align-middle result-table mb-0">
                <tbody>
                <tr>
                    <th>RspCode</th>
                    <td><code th:text="${result.rspCode}"></code></td>
                </tr>
                <tr>
                    <th>RspMsg</th>
                    <td th:text="${result.rspMsg}"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <details class="mt-3">
            <summary>Phản hồi JSON</summary>
            <pre class="raw-json" th:text="${result.rawResponse}"></pre>
        </details>

        <div class="mt-4 d-grid gap-2 d-md-flex">
            <a th:href="@{${backLink}}" class="btn btn-primary flex-fill">Thực hiện lại</a>
            <a th:href="@{/}" class="btn btn-outline-secondary flex-fill">Về menu chính</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
