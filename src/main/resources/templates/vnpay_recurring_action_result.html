<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kết quả thao tác định kỳ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/vnpay-demo.css}">
    <style>
        .page-shell { max-width: 900px; margin: 0 auto; }
        .card-elevated { border-radius: 14px; }
        .section-title { font-weight: 600; }
        pre { background-color: #f4f6f9; padding: 16px; border-radius: 10px; }
    </style>
</head>
<body class="vnpay-demo py-5">

<div class="page-shell container">
    <div class="text-center mb-4">
        <h1 class="section-title mb-1" th:text="${title}">Kết quả</h1>
        <p class="text-muted mb-0">Phản hồi thao tác định kỳ từ VNPay.</p>
    </div>

    <div class="card-elevated p-4">
        <div class="text-center mb-3">
            <img th:src="@{/vnpay-logo.png}" alt="VNPAY" style="width: 90px;">
        </div>
        <p><strong>RspCode:</strong> <span th:text="${result.rspCode}"></span></p>
        <p><strong>RspMsg:</strong> <span th:text="${result.rspMsg}"></span></p>

        <div th:if="${result.success}" class="alert alert-success">
            Thao tác thành công.
        </div>
        <div th:if="${!result.success}" class="alert alert-danger">
            Thao tác thất bại. Xem phản hồi bên dưới để biết chi tiết.
        </div>

        <p class="fw-bold">Phản hồi JSON:</p>
        <pre th:text="${result.rawResponse}"></pre>

        <div class="mt-4 d-flex flex-column flex-md-row gap-2">
            <a th:href="@{${backLink}}" class="btn btn-primary flex-fill">Thực hiện lại</a>
            <a th:href="@{/}" class="btn btn-outline-secondary flex-fill">Về menu chính</a>
        </div>
    </div>
</div>

</body>
</html>
