<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hủy đăng ký - VNPAY</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/vnpay-demo.css}">
    <style>
        .page-shell { max-width: 720px; margin: 0 auto; }
        .card-elevated { border-radius: 14px; }
        .section-title { font-weight: 600; }
        .form-control, .form-select {
            border-radius: 10px;
            padding: 0.65rem 0.9rem;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 0.2rem rgba(0, 82, 204, 0.15);
        }
    </style>
</head>
<body class="vnpay-demo py-5">

<div class="page-shell container">
    <div class="text-center mb-4">
        <h1 class="section-title mb-1">Hủy đăng ký định kỳ</h1>
        <p class="text-muted mb-0">Dừng hợp đồng thanh toán định kỳ.</p>
    </div>

    <div class="card-elevated p-4">
        <div class="text-center mb-3">
            <img th:src="@{/vnpay-logo.png}" alt="VNPAY" style="width: 90px;">
        </div>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/vnpay/recurring/cancel}" method="post">
            <div class="mb-3">
                <label for="recurringId" class="form-label">Mã recurringId</label>
                <input type="text" class="form-control" id="recurringId" name="recurringId" required/>
            </div>
            <div class="mb-3">
                <label for="tokenId" class="form-label">Mã tokenId</label>
                <input type="text" class="form-control" id="tokenId" name="tokenId" required/>
            </div>
            <div class="mb-3">
                <label for="addData" class="form-label">Thông tin bổ sung (addData)</label>
                <input type="text" class="form-control" id="addData" name="addData" value=""/>
            </div>

            <button type="submit" class="btn btn-primary w-100">Hủy đăng ký</button>
        </form>
        <div class="mt-3">
            <a th:href="@{/}" class="btn btn-outline-secondary w-100">Về menu chính</a>
        </div>
    </div>
</div>
</body>
</html>
