<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thanh toán định kỳ - VNPAY</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/vnpay-demo.css}">
    <style>
        .page-shell { max-width: 820px; margin: 0 auto; }
        .card-elevated { border-radius: 14px; }
        .section-title { font-weight: 600; }
        .form-section {
            font-weight: 600;
            color: var(--brand, #0052cc);
            border-left: 3px solid var(--brand, #0052cc);
            padding-left: 0.6rem;
            margin-top: 0.5rem;
        }
        .form-control, .form-select {
            border-radius: 10px;
            padding: 0.65rem 0.9rem;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 0.2rem rgba(0, 82, 204, 0.15);
        }
        .form-text { font-size: 0.82rem; color: #6c757d; }
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body class="vnpay-demo py-5">

<div class="page-shell container">
    <div class="text-center mb-4">
        <h1 class="section-title mb-1">Thanh toán định kỳ</h1>
        <p class="text-muted mb-0">Thực hiện thanh toán kỳ tiếp theo của hợp đồng đã đăng ký.</p>
    </div>

    <div class="card-elevated card p-4">
        <div class="text-center mb-3">
            <img th:src="@{/vnpay-logo.png}" alt="VNPAY" style="width: 90px;">
        </div>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/vnpay/recurring/pay}" method="post">
            <div class="row g-3">

                <div class="col-12">
                    <div class="form-section">Thông tin đơn hàng</div>
                </div>

                <div class="col-md-6">
                    <label for="orderReference" class="form-label">Mã tham chiếu</label>
                    <input type="text" class="form-control" id="orderReference" name="orderReference" required
                           th:value="${prefillOrderReference}"
                           placeholder="orderReference" maxlength="100"/>
                </div>

                <div class="col-md-6">
                    <label for="orderInfo" class="form-label">Nội dung đơn hàng</label>
                    <input type="text" class="form-control" id="orderInfo" name="orderInfo" required
                           value="Thanh toan dinh ky"/>
                </div>

                <div class="col-12">
                    <div class="form-section">Thông tin định kỳ</div>
                </div>

                <div class="col-md-6">
                    <label for="recurringId" class="form-label">Mã recurringId</label>
                    <input type="text" class="form-control" id="recurringId" name="recurringId" required
                           th:value="${prefillRecurringId}"
                           placeholder="VNPAY recurringId"/>
                </div>

                <div class="col-md-6">
                    <label for="tokenId" class="form-label">Mã tokenId</label>
                    <input type="text" class="form-control" id="tokenId" name="tokenId" required
                           placeholder="TokenId từ IPN/return"/>
                </div>

                <div class="col-md-6">
                    <label for="recurringAmount" class="form-label">Số tiền mỗi kỳ (x100)</label>
                    <input type="number" class="form-control" id="recurringAmount" name="recurringAmount" required
                           value="200000000" min="1"/>
                    <div class="form-text">Ví dụ 2,000,000 VND => 200000000.</div>
                </div>

                <div class="col-md-6">
                    <label for="recurringDate" class="form-label">Ngày thanh toán</label>
                    <input type="text" class="form-control" id="recurringDate" name="recurringDate" required
                           value="20261215" placeholder="yyyyMMdd"/>
                </div>

                <div class="col-12">
                    <div class="form-section">Tuỳ chọn khác</div>
                </div>

                <div class="col-12">
                    <label for="addData" class="form-label">Thông tin bổ sung (addData)</label>
                    <input type="text" class="form-control" id="addData" name="addData" value=""/>
                </div>
            </div>

            <div class="mt-4 d-grid gap-2">
                <button type="submit" class="btn btn-primary">Thực hiện thanh toán</button>
                <a th:href="@{/}" class="btn btn-outline-secondary">Về menu chính</a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
