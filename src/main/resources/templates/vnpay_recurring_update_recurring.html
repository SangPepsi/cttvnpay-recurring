<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cập nhật số kỳ - VNPAY</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/vnpay-demo.css}">
    <style>
        .page-shell { max-width: 820px; margin: 0 auto; }
        .card-elevated { border-radius: 14px; }
        .section-title { font-weight: 600; }
        .form-section {
            font-weight: 600;
            color: var(--brand, #0052cc);
            border-left: 3px solid var(--brand, #0052cc);
            padding-left: 0.6rem;
            margin-top: 0.5rem;
        }
        .form-control, .form-select {
            border-radius: 10px;
            padding: 0.65rem 0.9rem;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 0.2rem rgba(0, 82, 204, 0.15);
        }
        .form-text { font-size: 0.82rem; color: #6c757d; }
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body class="vnpay-demo py-5">

<div class="page-shell container">
    <div class="text-center mb-4">
        <h1 class="section-title mb-1">Cập nhật số kỳ đăng ký</h1>
        <p class="text-muted mb-0">Điều chỉnh số kỳ và tổng tiền của hợp đồng định kỳ.</p>
    </div>

    <div class="card-elevated card p-4">
        <div class="text-center mb-3">
            <img th:src="@{/vnpay-logo.png}" alt="VNPAY" style="width: 90px;">
        </div>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/vnpay/recurring/update-recurring}" method="post">
            <div class="row g-3">

                <div class="col-12">
                    <div class="form-section">Định danh hợp đồng</div>
                </div>

                <div class="col-md-6">
                    <label for="recurringId" class="form-label">Mã recurringId</label>
                    <input type="text" class="form-control" id="recurringId" name="recurringId" required
                           placeholder="VNPAY recurringId"/>
                </div>

                <div class="col-md-6">
                    <label for="tokenId" class="form-label">Mã tokenId</label>
                    <input type="text" class="form-control" id="tokenId" name="tokenId" required
                           placeholder="TokenId của thẻ đăng ký"/>
                </div>

                <div class="col-12">
                    <div class="form-section">Thông tin cập nhật</div>
                </div>

                <div class="col-md-6">
                    <label for="recurringNumber" class="form-label">Số kỳ mới</label>
                    <input type="number" class="form-control" id="recurringNumber" name="recurringNumber" required
                           value="3" min="0"/>
                    <div class="form-text">0 = hợp đồng không kỳ hạn.</div>
                </div>

                <div class="col-md-6">
                    <label for="recurringEndDate" class="form-label">Ngày kết thúc</label>
                    <input type="text" class="form-control" id="recurringEndDate" name="recurringEndDate" required
                           value="20271215" placeholder="yyyyMMdd"/>
                </div>

                <div class="col-12">
                    <label for="amount" class="form-label">Tổng tiền (x100)</label>
                    <input type="number" class="form-control" id="amount" name="amount" required
                           value="600000000" min="0"/>
                    <div class="form-text">Ví dụ 6,000,000 VND => 600000000.</div>
                </div>

                <div class="col-12">
                    <div class="form-section">Tuỳ chọn khác</div>
                </div>

                <div class="col-12">
                    <label for="addData" class="form-label">Thông tin bổ sung (addData)</label>
                    <input type="text" class="form-control" id="addData" name="addData" value=""/>
                </div>
            </div>

            <div class="mt-4 d-grid gap-2">
                <button type="submit" class="btn btn-primary">Cập nhật số kỳ</button>
                <a th:href="@{/}" class="btn btn-outline-secondary">Về menu chính</a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
